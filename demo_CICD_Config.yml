name: Docker Build & Push

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t products-api .

    - name: Tag Image
      run: docker tag products-api ${{ secrets.DOCKER_USERNAME }}/products-api

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    - name: Push Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/products-api
